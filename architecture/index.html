<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'self'; img-src 'none'; object-src 'none'">
<title>Secure Agent Lab — encrypted architecture</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0c1323;color:#e4edf8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.panel{width:min(100%,540px);background:#17253a;border:1px solid #334862;border-radius:20px;padding:28px;box-shadow:0 20px 90px #0006}h1{font-size:clamp(20px,4vw,28px);margin:0 0 10px}p{line-height:1.55;color:#b8cce2}code{color:#b8f8d5}input{width:100%;background:#0c1323;border:1px solid #476582;border-radius:10px;padding:13px;color:#fff;font:inherit;margin:8px 0 12px}button{font:inherit;font-weight:700;background:#55ceac;color:#0c1323;border:0;border-radius:10px;padding:13px 18px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}.error{color:#ffb3b3}small{display:block;margin-top:14px;color:#97a9bf}
</style>
</head>
<body><main class="panel" id="gate" aria-live="polite"><h1>Secure Agent Lab</h1><p id="status">Decrypting the architecture locally…</p><div id="fallback" hidden><label for="key">Access key</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste the key from your private link"><button id="unlock">Unlock architecture</button></div><small>The document is AES-256-GCM encrypted. Your key is read from the URL fragment and is not sent to GitHub or the hosting server.</small></main>
<script id="payload" type="application/octet-stream"></script>
<script>
(()=>{'use strict';
const nonce='WZgmeiin6dQ+apYx';
const status=document.getElementById('status');
const fallback=document.getElementById('fallback');
const keyInput=document.getElementById('key');
const urlKey=()=>{const p=new URLSearchParams(location.hash.slice(1));return p.get('k')||''};
const toBytes=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');const b=atob(s.padEnd(Math.ceil(s.length/4)*4,'='));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function decrypt(encodedKey){
  if(!encodedKey){status.textContent='No access key in this URL.';fallback.hidden=false;return;}
  try{
    const keyBytes=toBytes(encodedKey.trim());
    if(keyBytes.length!==32)throw new Error('Key must be 256 bits');
    const key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);
    const payloadFiles=["payload-01.txt","payload-02.txt","payload-03.txt","payload-04.txt","payload-05.txt","payload-06.txt","payload-07.txt"];
    const payloadParts=await Promise.all(payloadFiles.map(async p=>{const res=await fetch(p,{cache:'no-store'});if(!res.ok)throw new Error('Payload missing');return await res.text()}));
    const payload=toBytes(payloadParts.join('').trim());
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:toBytes(nonce),additionalData:new TextEncoder().encode('secure-agent-lab-architecture-v1')},key,payload);
    const stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=new TextDecoder('utf-8',{fatal:true}).decode(await new Response(stream).arrayBuffer());
    // Replace the encrypted wrapper with the original, standalone interactive document.
    document.open();document.write(html);document.close();
  }catch(e){status.className='error';status.textContent='The access key is invalid, or the encrypted document is damaged.';fallback.hidden=false;}
}
document.getElementById('unlock').addEventListener('click',()=>decrypt(keyInput.value));
keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')decrypt(keyInput.value)});
decrypt(urlKey());
})();
</script></body></html>
